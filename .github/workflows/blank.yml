
name: Extract uploaded ZIP

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()

          for archive in root.rglob("*.zip"):
              if ".git" in archive.parts:
                  continue
              if not zipfile.is_zipfile(archive):
                  continue

              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      target = (archive.parent / item.filename).resolve()
                      base = archive.parent.resolve()
                      if target != base and base not in target.parents:
                          raise ValueError("Unsafe ZIP path")
                  z.extractall(archive.parent)

              print("Extracted:", archive.name)
          PY

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Extract uploaded ZIP"
            git push
          )
